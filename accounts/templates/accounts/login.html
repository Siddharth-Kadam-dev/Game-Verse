{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Game Verse</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background-color: #1e293b; border-radius: 10px; padding: 30px; width: 100%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .card h2 { text-align: center; color: #38bdf8; margin-bottom: 20px; }
        .error { background: #ef4444; color: white; padding: 10px; border-radius: 5px; font-size: 14px; margin-bottom: 15px; text-align: center; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; color: #94a3b8; }
        .form-group input { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #334155; background: #0f172a; color: white; outline: none; }
        .form-group input:focus { border-color: #38bdf8; }
        .btn { width: 100%; padding: 10px; border: none; border-radius: 5px; background: #0284c7; color: white; font-weight: bold; cursor: pointer; }
        .btn:hover { background: #0369a1; }
        .footer { text-align: center; margin-top: 15px; font-size: 14px; color: #94a3b8; }
        .footer a { color: #38bdf8; text-decoration: none; }
        @media (max-width: 480px) { .card { padding: 20px; } }
    </style>
</head>
<body>
    <div class="card">
        <h2>Game Verse Login</h2>
        {% if messages %}
            {% for message in messages %}
                <div class="error">{{ message }}</div>
            {% endfor %}
        {% endif %}
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required placeholder="Enter username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required placeholder="Enter password">
            </div>
            <button type="submit" class="btn">Login</button>
        </form>
        <div class="footer">
            Don't have an account? <a href="{% url 'register' %}">Register</a>
        </div>
    </div>
</body>
</html>
